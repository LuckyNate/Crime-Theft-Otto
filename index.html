<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crime Game Prototype</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:white; font:24px/1 sans-serif; text-shadow:0 0 4px #000; }
  #movePad { position:absolute; z-index:2; left:18px; bottom:18px; width:132px; height:132px; border:2px solid rgba(255,255,255,.35); border-radius:50%; background:rgba(0,0,0,.16); pointer-events:auto; }
  #moveKnob { position:absolute; left:50%; top:50%; width:58px; height:58px; transform:translate(-50%,-50%); border-radius:50%; background:rgba(255,255,255,.35); }
  #lookPad { position:absolute; inset:0; z-index:1; pointer-events:auto; }
  #fire { position:absolute; z-index:2; right:24px; bottom:28px; width:92px; height:92px; border-radius:50%; border:2px solid rgba(255,255,255,.5); background:rgba(150,0,0,.58); color:white; font:700 16px sans-serif; pointer-events:auto; }
  #stats { position:absolute; left:12px; top:10px; padding:7px 9px; background:rgba(0,0,0,.4); color:white; font:12px/1.35 monospace; white-space:pre; }
</style>
</head>
<body>
<div id="hud">
  <div id="crosshair">•</div>
  <div id="stats"></div>
  <div id="movePad"><div id="moveKnob"></div></div>
  <div id="lookPad"></div>
  <button id="fire">FIRE</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
