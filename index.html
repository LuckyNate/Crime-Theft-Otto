<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crime Game Prototype</title>
<style>
  html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  canvas { display:block; width:100%; height:100%; }

  #hud {
    position:fixed;
    inset:0;
    pointer-events:none;
  }

  #crosshair {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font:24px/1 sans-serif;
    text-shadow:0 0 4px #000;
  }

  #movePad {
    position:absolute;
    z-index: 1;
    left:0;
    bottom:0;
    width:132px;
    height:132px;
    border:2px solid rgba(255,255,255,.35);
    border-radius:50%;
    background:rgba(0,0,0,.16);
    pointer-events:auto;
  }

  #moveKnob {
    position:absolute;
    left:50%;
    top:50%;
    width:58px;
    height:58px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.35);
  }

  #lookPad {
    position:absolute;
    inset: 0;
    z-index:1;
    pointer-events:auto;
  }
#stats {
    position:absolute;
    left:12px;
    top:10px;
    padding:7px 9px;
    background:rgba(0,0,0,.4);
    color:white;
    font:12px/1.35 monospace;
    white-space:pre;
  }

    #controlsBar {
      position: absolute;
      left: 18px;
      bottom: 18px;
      width: 132px;
      height: 132px;
      z-index: 3;
      pointer-events: none;
      touch-action: none;
    }

    #controlsBar #movePad {
      pointer-events: auto;
    }

  </style>

  <style>
    #phonePanel {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 190px;
      height: 300px;
      border: 3px solid #111;
      border-radius: 22px;
      background: #1b1b1b;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      z-index: 20;
      display: none;
      overflow: hidden;
      font-family: sans-serif;
      color: white;
      touch-action: none;
    }

    #phonePanel.open {
      display: block;
    }

    #phoneHeader {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: #2b2b2b;
      font-weight: 700;
      font-size: 15px;
      box-sizing: border-box;
    }

    #carContact,
    .phoneContact {
      margin: 12px;
      min-height: 58px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #3a3a3a;
      display: flex;
      align-items: center;
      gap: 10px;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    #carContact:active,
    .phoneContact:active {
      background: #4a4a4a;
    }

    #carContactIcon,
    .phoneContactIcon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #111;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex: 0 0 auto;
    }

    #carContactText,
    .phoneContactText {
      font-size: 16px;
      font-weight: 700;
    }
  </style>

</head>
<body>
<div id="hud">
  <div id="crosshair">•</div>
  <div id="stats"></div>

  

  <div id="lookPad"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./src/main.js"></script>

  <div id="controlsBar">
    <div id="movePad">
    <div id="moveKnob"></div>
  </div>
  </div>


  <div id="phonePanel">
    <div id="phoneHeader">Phone</div>
    <div id="carContact">
      <div id="carContactIcon">🚗</div>
      <div id="carContactText">Car</div>
    </div>

    <div id="photoContact" class="phoneContact">
      <div class="phoneContactIcon">📷</div>
      <div class="phoneContactText">Photo</div>
    </div>

    <div id="homeContact" class="phoneContact">
      <div class="phoneContactIcon">⌂</div>
      <div class="phoneContactText">Home</div>
    </div>
  </div>

</body>
</html>
